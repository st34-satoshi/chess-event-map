services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.production
    command: bash -c "rm -f tmp/pids/server.pid && RAILS_ENV=production bundle exec rails assets:precompile && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/chess_event_map
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: true
    healthcheck:
      test: "curl http://localhost:3000 || exit 1"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 10s
  nginx:
    container_name: chess_event_map_nginx
    build: docker/nginx/
    volumes:
      - ./run/:/var/run/
    depends_on:
      web:
        condition: service_healthy
