# CI runner for local development and Claude Code on GitHub Actions.
# Usage: bin/ci-docker
services:
  db:
    image: mysql:8.3.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ci:
    image: ruby:4.0.5-bookworm
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ci-bundle-cache:/usr/local/bundle
    environment:
      RAILS_ENV: test
      DATABASE_URL: mysql2://root@db:3306
      BUNDLE_PATH: /usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["script/docker-ci-entrypoint.sh"]

volumes:
  ci-bundle-cache:
